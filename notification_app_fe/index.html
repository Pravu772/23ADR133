<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Notification Priority Inbox</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: #f7f8fa;
      color: #222;
    }
    h1 {
      margin-bottom: 12px;
    }
    #status {
      margin-bottom: 16px;
      color: #333;
    }
    .warning {
      color: #b33;
    }
    .item {
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid #ccd0d8;
      border-radius: 8px;
      background: #fff;
    }
    .item strong {
      display: inline-block;
      width: 80px;
    }
  </style>
</head>
<body>
  <h1>Top Priority Notifications</h1>
  <div id="status">Loading notifications...</div>
  <div id="output"></div>

  <script src="app.js"></script>
</body>
</html>
